name: Build TR4QT

on:
  push:
    branches: [ master, main, develop ]
    tags:
      - 'v*'       # Release tags: v2.90.1
      - 'v*-beta*' # Beta releases: v2.91.0-beta1
      - 'v*-rc*'   # Release candidates: v2.91.0-rc1
      - 'test-*'   # Test builds: test-needs-widget
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

env:
  QT_VERSION: '6.7.2'
  HAMLIB_VERSION: '4.5.5'

permissions:
  contents: write

jobs:
  build-windows:
    name: Windows (MinGW)
    runs-on: windows-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Install Qt
      uses: jurplel/install-qt-action@v4
      with:
        version: ${{ env.QT_VERSION }}
        host: windows
        target: desktop
        arch: win64_mingw
        tools: 'tools_mingw1310'
        modules: 'qtwebsockets qthttpserver'  # Additional modules (HttpServer depends on WebSockets)
        cache: true

    - name: Download Hamlib
      shell: bash
      run: |
        curl -L -o hamlib.zip "https://github.com/Hamlib/Hamlib/releases/download/${{ env.HAMLIB_VERSION }}/hamlib-w64-${{ env.HAMLIB_VERSION }}.zip"
        unzip hamlib.zip -d hamlib-temp
        # Find the extracted directory (it may have version in name)
        HAMLIB_DIR=$(ls -d hamlib-temp/hamlib-w64-* 2>/dev/null | head -1)
        if [ -z "$HAMLIB_DIR" ]; then
          HAMLIB_DIR="hamlib-temp"
        fi
        mkdir -p C:/hamlib
        cp -r "$HAMLIB_DIR"/* C:/hamlib/ || cp -r hamlib-temp/* C:/hamlib/
        ls -la C:/hamlib/
        ls -la C:/hamlib/bin/ || true
        ls -la C:/hamlib/lib/ || true

    - name: Configure CMake
      shell: bash
      run: |
        export PATH="${{ runner.temp }}/../Qt/Tools/mingw1310_64/bin:$PATH"
        cmake -B build -G "MinGW Makefiles" \
          -DCMAKE_BUILD_TYPE=Release \
          -DCMAKE_PREFIX_PATH="${{ env.QT_ROOT_DIR }}" \
          -DHAMLIB_ROOT="C:/hamlib"

    - name: Build
      shell: bash
      run: |
        export PATH="${{ runner.temp }}/../Qt/Tools/mingw1310_64/bin:$PATH"
        cmake --build build --config Release -j4

    - name: Run Tests
      shell: bash
      run: |
        export PATH="${{ runner.temp }}/../Qt/Tools/mingw1310_64/bin:${{ env.QT_ROOT_DIR }}/bin:C:/hamlib/bin:$PATH"
        cd build
        ctest --output-on-failure -C Release
      continue-on-error: true

    - name: Deploy Qt
      shell: bash
      run: |
        export PATH="${{ env.QT_ROOT_DIR }}/bin:$PATH"
        windeployqt build/src/tr4qt.exe --release --no-translations
        cp C:/hamlib/bin/*.dll build/src/ || true

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: TR4QT-Windows
        path: |
          build/src/tr4qt.exe
          build/src/*.dll
          build/src/platforms/
          build/src/imageformats/
          build/src/styles/
          build/src/tls/

  build-macos:
    name: macOS
    runs-on: macos-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Install Dependencies
      run: |
        brew install qt@6 hamlib
        echo "Qt6_DIR=$(brew --prefix qt@6)/lib/cmake/Qt6" >> $GITHUB_ENV
        echo "HAMLIB_ROOT=$(brew --prefix hamlib)" >> $GITHUB_ENV

    - name: Configure CMake
      run: |
        cmake -B build \
          -DCMAKE_BUILD_TYPE=Release \
          -DCMAKE_PREFIX_PATH="$(brew --prefix qt@6)" \
          -DHAMLIB_ROOT="$(brew --prefix hamlib)"

    - name: Build
      run: cmake --build build --config Release -j$(sysctl -n hw.ncpu)

    - name: Run Tests
      run: |
        cd build
        ctest --output-on-failure -C Release
      continue-on-error: true

    - name: Create App Bundle
      run: |
        cd build/src

        # Pre-copy Hamlib and remove Homebrew signature BEFORE macdeployqt
        # This allows macdeployqt to process it with install_name_tool
        mkdir -p tr4qt.app/Contents/Frameworks
        cp $(brew --prefix hamlib)/lib/libhamlib.*.dylib tr4qt.app/Contents/Frameworks/ || true
        for lib in tr4qt.app/Contents/Frameworks/libhamlib.*.dylib; do
          if [ -f "$lib" ]; then
            chmod +w "$lib"
            codesign --remove-signature "$lib" || true
          fi
        done

        # Now run macdeployqt - it will discover and process Hamlib successfully
        $(brew --prefix qt@6)/bin/macdeployqt tr4qt.app -verbose=2

        # Fix Hamlib library paths to use @rpath (macdeployqt doesn't know about Hamlib)
        for lib in tr4qt.app/Contents/Frameworks/libhamlib.*.dylib; do
          if [ -f "$lib" ]; then
            install_name_tool -id "@rpath/$(basename $lib)" "$lib"
          fi
        done

        # Update executable to look for Hamlib in @rpath
        install_name_tool -add_rpath "@executable_path/../Frameworks" tr4qt.app/Contents/MacOS/tr4qt || true

        # Sign everything with ad-hoc signatures AFTER all modifications
        for lib in tr4qt.app/Contents/Frameworks/libhamlib.*.dylib; do
          if [ -f "$lib" ]; then
            codesign -s - "$lib"
          fi
        done
        codesign -s - --deep tr4qt.app

        # Create DMG
        $(brew --prefix qt@6)/bin/macdeployqt tr4qt.app -dmg

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: TR4QT-macOS
        path: build/src/tr4qt.dmg

  build-linux-x86_64:
    name: Linux (x86_64)
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          cmake \
          libgl1-mesa-dev \
          libhamlib-dev \
          qt6-base-dev \
          qt6-websockets-dev \
          libqt6sql6-sqlite \
          libqt6network6 \
          libqt6httpserver6-dev \
          libfuse2

    - name: Configure CMake
      run: |
        cmake -B build \
          -DCMAKE_BUILD_TYPE=Release \
          -DCMAKE_INSTALL_PREFIX=/usr

    - name: Build
      run: cmake --build build --config Release -j$(nproc)

    - name: Run Tests
      run: |
        cd build
        ctest --output-on-failure -C Release
      continue-on-error: true

    - name: Install to AppDir
      run: |
        DESTDIR=$PWD/appdir cmake --install build
        mkdir -p appdir/usr/share/applications
        mkdir -p appdir/usr/share/icons/hicolor/256x256/apps

        # Create desktop entry
        cat > appdir/usr/share/applications/tr4qt.desktop <<EOF
        [Desktop Entry]
        Type=Application
        Name=TR4QT
        Comment=Amateur Radio Contest Logger
        Exec=tr4qt
        Icon=tr4qt
        Categories=HamRadio;Network;
        EOF

    - name: Create AppImage
      run: |
        wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
        wget -q https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage
        chmod +x linuxdeploy*.AppImage

        export QMAKE=/usr/lib/qt6/bin/qmake
        export LD_LIBRARY_PATH=/usr/lib/x86_64-linux-gnu:$LD_LIBRARY_PATH

        ./linuxdeploy-x86_64.AppImage \
          --appdir appdir \
          --plugin qt \
          --output appimage

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: TR4QT-Linux-x86_64
        path: TR4QT*.AppImage

  build-linux-arm64:
    name: Linux (ARM64/RPi)
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Set up QEMU
      uses: docker/setup-qemu-action@v3
      with:
        platforms: arm64

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build ARM64 in Docker
      run: |
        docker run --rm --platform linux/arm64 \
          -v $PWD:/workspace \
          -w /workspace \
          arm64v8/ubuntu:22.04 \
          bash -c "
            apt-get update && \
            DEBIAN_FRONTEND=noninteractive apt-get install -y \
              build-essential \
              cmake \
              libgl1-mesa-dev \
              libhamlib-dev \
              qt6-base-dev \
              qt6-websockets-dev \
              libqt6sql6-sqlite \
              libqt6network6 \
              libqt6httpserver6-dev \
              libfuse2 \
              wget \
              file && \
            cmake -B build \
              -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_INSTALL_PREFIX=/usr && \
            cmake --build build --config Release -j\$(nproc) && \
            DESTDIR=/workspace/appdir cmake --install build && \
            mkdir -p /workspace/appdir/usr/share/applications && \
            mkdir -p /workspace/appdir/usr/share/icons/hicolor/256x256/apps && \
            cat > /workspace/appdir/usr/share/applications/tr4qt.desktop <<EOF
        [Desktop Entry]
        Type=Application
        Name=TR4QT
        Comment=Amateur Radio Contest Logger
        Exec=tr4qt
        Icon=tr4qt
        Categories=HamRadio;Network;
        EOF
            cd /workspace && \
            wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-aarch64.AppImage && \
            wget -q https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-aarch64.AppImage && \
            chmod +x linuxdeploy*.AppImage && \
            export QMAKE=/usr/lib/aarch64-linux-gnu/qt6/bin/qmake && \
            export LD_LIBRARY_PATH=/usr/lib/aarch64-linux-gnu:\$LD_LIBRARY_PATH && \
            ./linuxdeploy-aarch64.AppImage \
              --appdir appdir \
              --plugin qt \
              --output appimage
          "

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: TR4QT-Linux-ARM64
        path: TR4QT*.AppImage

  # Create release when a tag is pushed
  release:
    name: Create Release
    needs: [build-windows, build-macos, build-linux-x86_64, build-linux-arm64]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        path: artifacts

    - name: Display structure
      run: ls -R artifacts

    - name: Create Windows ZIP
      run: |
        cd artifacts/TR4QT-Windows
        zip -r ../TR4QT-${{ github.ref_name }}-Windows.zip .

    - name: Rename macOS DMG
      run: |
        mv artifacts/TR4QT-macOS/tr4qt.dmg artifacts/TR4QT-${{ github.ref_name }}-macOS.dmg

    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        files: |
          artifacts/TR4QT-${{ github.ref_name }}-Windows.zip
          artifacts/TR4QT-${{ github.ref_name }}-macOS.dmg
        draft: ${{ !contains(github.ref_name, '-rc') }}
        prerelease: ${{ contains(github.ref_name, '-beta') || contains(github.ref_name, '-rc') }}
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Upload test artifacts for test-* tags (no release created)
  test-artifacts:
    name: Upload Test Artifacts
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/test-')

    steps:
    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        path: artifacts

    - name: Display structure
      run: ls -R artifacts

    - name: Create Windows ZIP
      run: |
        cd artifacts/TR4QT-Windows
        zip -r ../TR4QT-${{ github.ref_name }}-Windows.zip .

    - name: Rename macOS DMG
      run: |
        mv artifacts/TR4QT-macOS/tr4qt.dmg artifacts/TR4QT-${{ github.ref_name }}-macOS.dmg

    - name: Upload combined test artifacts
      uses: actions/upload-artifact@v4
      with:
        name: test-build-${{ github.ref_name }}
        path: |
          artifacts/TR4QT-${{ github.ref_name }}-Windows.zip
          artifacts/TR4QT-${{ github.ref_name }}-macOS.dmg
        retention-days: 30
