  build-linux-arm64:
    name: Linux (ARM64/RPi)
    runs-on: ubuntu-latest
    continue-on-error: true  # Qt HttpServer not in Ubuntu repos yet

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Set up QEMU
      uses: docker/setup-qemu-action@v3
      with:
        platforms: arm64

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build ARM64 in Docker
      run: |
        docker run --rm --platform linux/arm64 \
          -v $PWD:/workspace \
          -w /workspace \
          arm64v8/ubuntu:24.04 \
          bash -c "
            set -e
            echo '==> Explicit Linux ARM64 Deployment (no linuxdeploy)'

            # Install dependencies
            apt-get update
            DEBIAN_FRONTEND=noninteractive apt-get install -y \
              build-essential cmake libgl1-mesa-dev libhamlib-dev \
              qt6-base-dev qt6-websockets-dev qt6-httpserver-dev \
              libqt6sql6-sqlite libqt6network6 libfuse2 wget file patchelf

            # Build
            echo '==> Building TR4QT...'
            cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr
            cmake --build build --config Release -j\$(nproc)

            # Create AppDir structure
            echo '==> Creating AppDir structure...'
            mkdir -p appdir/usr/bin appdir/usr/lib appdir/usr/share/applications
            mkdir -p appdir/usr/plugins/platforms appdir/usr/plugins/sqldrivers

            # Copy executable
            cp build/src/tr4qt appdir/usr/bin/

            # Copy Qt libraries explicitly
            echo '==> Copying Qt libraries...'
            QT_LIBS=(
              libQt6Core.so.6 libQt6Gui.so.6 libQt6Widgets.so.6
              libQt6Network.so.6 libQt6Sql.so.6 libQt6HttpServer.so.6
              libQt6WebSockets.so.6 libQt6PrintSupport.so.6
              libQt6Concurrent.so.6 libQt6DBus.so.6
            )
            for lib in \${QT_LIBS[@]}; do
              cp /usr/lib/aarch64-linux-gnu/\$lib appdir/usr/lib/ || echo \"WARNING: \$lib not found\"
            done

            # Copy Qt plugins
            echo '==> Copying Qt plugins...'
            cp /usr/lib/aarch64-linux-gnu/qt6/plugins/platforms/libqxcb.so appdir/usr/plugins/platforms/
            cp /usr/lib/aarch64-linux-gnu/qt6/plugins/sqldrivers/libqsqlite.so appdir/usr/plugins/sqldrivers/

            # Copy Hamlib and other system libs
            echo '==> Copying system libraries...'
            cp /usr/lib/aarch64-linux-gnu/libhamlib.so.4 appdir/usr/lib/ || true

            # Create desktop entry
            cat > appdir/usr/share/applications/tr4qt.desktop <<'DESKTOP_EOF'
        [Desktop Entry]
        Type=Application
        Name=TR4QT
        Comment=Amateur Radio Contest Logger
        Exec=tr4qt
        Icon=tr4qt
        Categories=HamRadio;Network;
        DESKTOP_EOF

            # Create AppRun script
            cat > appdir/AppRun <<'APPRUN_EOF'
        #!/bin/bash
        SELF=\$(readlink -f \"\$0\")
        HERE=\${SELF%/*}
        export LD_LIBRARY_PATH=\"\${HERE}/usr/lib:\$LD_LIBRARY_PATH\"
        export QT_PLUGIN_PATH=\"\${HERE}/usr/plugins\"
        exec \"\${HERE}/usr/bin/tr4qt\" \"\$@\"
        APPRUN_EOF
            chmod +x appdir/AppRun

            # Create AppImage using appimagetool
            echo '==> Creating AppImage...'
            wget -q https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-aarch64.AppImage
            chmod +x appimagetool-aarch64.AppImage
            ARCH=aarch64 ./appimagetool-aarch64.AppImage appdir TR4QT-ARM64.AppImage

            echo '==> Deployment complete'
            ls -lh TR4QT-ARM64.AppImage
          "

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: TR4QT-Linux-ARM64
        path: TR4QT*.AppImage

  # Create release when a tag is pushed
  release:
    name: Create Release
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        path: artifacts

    - name: Display structure
      run: ls -R artifacts

    - name: Create Windows ZIP
      run: |
        cd artifacts/TR4QT-Windows
        zip -r ../TR4QT-${{ github.ref_name }}-Windows.zip .

    - name: Rename Windows Installer
      run: |
        mv artifacts/TR4QT-Windows/TR4QT-*-Setup.exe artifacts/TR4QT-${{ github.ref_name }}-Setup.exe || true

    - name: Rename macOS DMG
      run: |
        mv artifacts/TR4QT-macOS/tr4qt.dmg artifacts/TR4QT-${{ github.ref_name }}-macOS.dmg

    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        files: |
          artifacts/TR4QT-${{ github.ref_name }}-Windows.zip
          artifacts/TR4QT-${{ github.ref_name }}-Setup.exe
          artifacts/TR4QT-${{ github.ref_name }}-macOS.dmg
        draft: ${{ !contains(github.ref_name, '-rc') }}
        prerelease: ${{ contains(github.ref_name, '-beta') || contains(github.ref_name, '-rc') }}
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Upload test artifacts for test-* tags (no release created)
  test-artifacts:
    name: Upload Test Artifacts
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/test-')

    steps:
    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        path: artifacts

    - name: Display structure
      run: ls -R artifacts

    - name: Create Windows ZIP
      run: |
        cd artifacts/TR4QT-Windows
        zip -r ../TR4QT-${{ github.ref_name }}-Windows.zip .

    - name: Rename macOS DMG
      run: |
        mv artifacts/TR4QT-macOS/tr4qt.dmg artifacts/TR4QT-${{ github.ref_name }}-macOS.dmg

    - name: Upload combined test artifacts
      uses: actions/upload-artifact@v4
      with:
        name: test-build-${{ github.ref_name }}
        path: |
          artifacts/TR4QT-${{ github.ref_name }}-Windows.zip
          artifacts/TR4QT-${{ github.ref_name }}-macOS.dmg
        retention-days: 30
