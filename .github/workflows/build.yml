name: Build TR4QT

on:
  push:
    branches: [ master, main, develop ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

env:
  QT_VERSION: '6.7.2'
  HAMLIB_VERSION: '4.5.5'

jobs:
  build-windows:
    name: Windows (MinGW)
    runs-on: windows-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Install Qt
      uses: jurplel/install-qt-action@v4
      with:
        version: ${{ env.QT_VERSION }}
        host: windows
        target: desktop
        arch: win64_mingw
        modules: qtconnectivity
        cache: true

    - name: Setup MinGW
      uses: egor-tensin/setup-mingw@v2
      with:
        platform: x64
        version: 13.2.0

    - name: Download Hamlib
      shell: bash
      run: |
        curl -L -o hamlib.zip "https://github.com/Hamlib/Hamlib/releases/download/${{ env.HAMLIB_VERSION }}/hamlib-w64-${{ env.HAMLIB_VERSION }}.zip"
        unzip hamlib.zip -d hamlib-temp
        # Find the extracted directory (it may have version in name)
        HAMLIB_DIR=$(ls -d hamlib-temp/hamlib-w64-* 2>/dev/null | head -1)
        if [ -z "$HAMLIB_DIR" ]; then
          HAMLIB_DIR="hamlib-temp"
        fi
        mkdir -p C:/hamlib
        cp -r "$HAMLIB_DIR"/* C:/hamlib/ || cp -r hamlib-temp/* C:/hamlib/
        ls -la C:/hamlib/

    - name: Configure CMake
      run: |
        cmake -B build -G "MinGW Makefiles" `
          -DCMAKE_BUILD_TYPE=Release `
          -DHAMLIB_ROOT="C:/hamlib"

    - name: Build
      run: cmake --build build --config Release -j4

    - name: Run Tests
      run: |
        cd build
        ctest --output-on-failure -C Release
      continue-on-error: true

    - name: Deploy Qt
      shell: bash
      run: |
        windeployqt build/src/tr4qt.exe --release --no-translations
        cp C:/hamlib/bin/*.dll build/src/ || true

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: TR4QT-Windows
        path: |
          build/src/tr4qt.exe
          build/src/*.dll
          build/src/platforms/
          build/src/imageformats/
          build/src/styles/
          build/src/tls/

  build-macos:
    name: macOS
    runs-on: macos-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Install Dependencies
      run: |
        brew install qt@6 hamlib
        echo "Qt6_DIR=$(brew --prefix qt@6)/lib/cmake/Qt6" >> $GITHUB_ENV
        echo "HAMLIB_ROOT=$(brew --prefix hamlib)" >> $GITHUB_ENV

    - name: Configure CMake
      run: |
        cmake -B build \
          -DCMAKE_BUILD_TYPE=Release \
          -DCMAKE_PREFIX_PATH="$(brew --prefix qt@6)" \
          -DHAMLIB_ROOT="$(brew --prefix hamlib)"

    - name: Build
      run: cmake --build build --config Release -j$(sysctl -n hw.ncpu)

    - name: Run Tests
      run: |
        cd build
        ctest --output-on-failure -C Release
      continue-on-error: true

    - name: Create App Bundle
      run: |
        cd build/src
        $(brew --prefix qt@6)/bin/macdeployqt tr4qt.app -dmg

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: TR4QT-macOS
        path: build/src/tr4qt.dmg

  build-linux:
    name: Linux (Ubuntu/Debian)
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          cmake \
          qt6-base-dev \
          qt6-tools-dev \
          qt6-tools-dev-tools \
          libqt6sql6-sqlite \
          libqt6network6 \
          libqt6printsupport6 \
          libqt6concurrent6 \
          libgl1-mesa-dev \
          libhamlib-dev \
          libhamlib4

    - name: Configure CMake
      run: |
        cmake -B build \
          -DCMAKE_BUILD_TYPE=Release \
          -DHAMLIB_ROOT="/usr"

    - name: Build
      run: cmake --build build --config Release -j$(nproc)

    - name: Run Tests
      run: |
        cd build
        ctest --output-on-failure -C Release
      continue-on-error: true

    - name: Package
      run: |
        mkdir -p package/TR4QT
        cp build/src/tr4qt package/TR4QT/
        cp -r build/src/*.so* package/TR4QT/ 2>/dev/null || true
        cd package
        tar -czvf TR4QT-Linux-x86_64.tar.gz TR4QT/

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: TR4QT-Linux-x86_64
        path: package/TR4QT-Linux-x86_64.tar.gz

  build-raspberry-pi:
    name: Raspberry Pi (ARM64)
    runs-on: ubuntu-24.04-arm

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          cmake \
          qt6-base-dev \
          qt6-tools-dev \
          qt6-tools-dev-tools \
          libqt6sql6-sqlite \
          libqt6network6 \
          libqt6printsupport6 \
          libqt6concurrent6 \
          libgl1-mesa-dev \
          libhamlib-dev \
          libhamlib4

    - name: Configure CMake
      run: |
        cmake -B build \
          -DCMAKE_BUILD_TYPE=Release \
          -DHAMLIB_ROOT="/usr"

    - name: Build
      run: cmake --build build --config Release -j$(nproc)

    - name: Run Tests
      run: |
        cd build
        ctest --output-on-failure -C Release
      continue-on-error: true

    - name: Package
      run: |
        mkdir -p package/TR4QT
        cp build/src/tr4qt package/TR4QT/
        cd package
        tar -czvf TR4QT-Linux-ARM64.tar.gz TR4QT/

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: TR4QT-Linux-ARM64
        path: package/TR4QT-Linux-ARM64.tar.gz

  # Create release when a tag is pushed
  release:
    name: Create Release
    needs: [build-windows, build-macos, build-linux, build-raspberry-pi]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        path: artifacts

    - name: Display structure
      run: ls -R artifacts

    - name: Create Windows ZIP
      run: |
        cd artifacts/TR4QT-Windows
        zip -r ../TR4QT-${{ github.ref_name }}-Windows.zip .

    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        files: |
          artifacts/TR4QT-${{ github.ref_name }}-Windows.zip
          artifacts/TR4QT-macOS/tr4qt.dmg
          artifacts/TR4QT-Linux-x86_64/TR4QT-Linux-x86_64.tar.gz
          artifacts/TR4QT-Linux-ARM64/TR4QT-Linux-ARM64.tar.gz
        draft: true
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
