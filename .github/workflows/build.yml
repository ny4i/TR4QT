  # Create release when a tag is pushed
  release:
    name: Create Release
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        path: artifacts

    - name: Display structure
      run: ls -R artifacts

    - name: Create Windows ZIP
      run: |
        cd artifacts/TR4QT-Windows
        zip -r ../TR4QT-${{ github.ref_name }}-Windows.zip .

    - name: Rename Windows Installer
      run: |
        mv artifacts/TR4QT-Windows/TR4QT-*-Setup.exe artifacts/TR4QT-${{ github.ref_name }}-Setup.exe || true

    - name: Prepare macOS DMG for release
      run: |
        # DMG already has version in filename, just move to expected location
        mv artifacts/TR4QT-macOS/TR4QT-*-macOS.dmg artifacts/TR4QT-${{ github.ref_name }}-macOS.dmg

    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        files: |
          artifacts/TR4QT-${{ github.ref_name }}-Windows.zip
          artifacts/TR4QT-${{ github.ref_name }}-Setup.exe
          artifacts/TR4QT-${{ github.ref_name }}-macOS.dmg
        draft: ${{ !contains(github.ref_name, '-rc') }}
        prerelease: ${{ contains(github.ref_name, '-beta') || contains(github.ref_name, '-rc') }}
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Upload test artifacts for test-* tags (no release created)
  test-artifacts:
    name: Upload Test Artifacts
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/test-')

    steps:
    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        path: artifacts

    - name: Display structure
      run: ls -R artifacts

    - name: Create Windows ZIP
      run: |
        cd artifacts/TR4QT-Windows
        zip -r ../TR4QT-${{ github.ref_name }}-Windows.zip .

    - name: Prepare macOS DMG for test artifacts
      run: |
        # DMG already has version in filename, just move to expected location
        mv artifacts/TR4QT-macOS/TR4QT-*-macOS.dmg artifacts/TR4QT-${{ github.ref_name }}-macOS.dmg

    - name: Upload combined test artifacts
      uses: actions/upload-artifact@v4
      with:
        name: test-build-${{ github.ref_name }}
        path: |
          artifacts/TR4QT-${{ github.ref_name }}-Windows.zip
          artifacts/TR4QT-${{ github.ref_name }}-macOS.dmg
        retention-days: 30

  notify:
    name: Slack Notification
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    if: always()  # Run even if builds fail

    steps:
    - name: Determine build status
      id: status
      run: |
        # Only Windows and macOS builds required
        if [ "${{ needs.build-windows.result }}" == "success" ] && \
           [ "${{ needs.build-macos.result }}" == "success" ]; then
          echo "status=✅ SUCCESS" >> $GITHUB_OUTPUT
          echo "color=good" >> $GITHUB_OUTPUT
        else
          echo "status=❌ FAILED" >> $GITHUB_OUTPUT
          echo "color=danger" >> $GITHUB_OUTPUT
        fi

    - name: Send Slack notification
      run: |
        curl -X POST ${{ secrets.SLACK_WEBHOOK_URL }} \
          -H 'Content-Type: application/json' \
          -d '{
            "attachments": [{
              "color": "${{ steps.status.outputs.color }}",
              "title": "TR4QT Build ${{ steps.status.outputs.status }}",
              "text": "Build triggered by ${{ github.event_name }}",
              "fields": [
                {
                  "title": "Windows",
                  "value": "${{ needs.build-windows.result }}",
                  "short": true
                },
                {
                  "title": "macOS",
                  "value": "${{ needs.build-macos.result }}",
                  "short": true
                },
                {
                  "title": "Branch/Tag",
                  "value": "${{ github.ref_name }}",
                  "short": true
                },
                {
                  "title": "Commit",
                  "value": "<${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}|${{ github.sha }}>",
                  "short": false
                },
                {
                  "title": "Build URL",
                  "value": "<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View Build>",
                  "short": false
                }
              ],
              "footer": "GitHub Actions",
              "ts": '${{ github.event.head_commit.timestamp }}'
            }]
          }'
