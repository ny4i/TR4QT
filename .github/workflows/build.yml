name: Build TR4QT

on:
  push:
    tags:
      - 'v*'       # Release tags: v2.90.1
      - 'v*-beta*' # Beta releases: v2.91.0-beta1
      - 'v*-rc*'   # Release candidates: v2.91.0-rc1
      - 'test-*'   # Test builds: test-needs-widget
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:
    inputs:
      build_windows:
        description: 'Build Windows'
        required: false
        default: 'true'
        type: boolean
      build_macos:
        description: 'Build macOS'
        required: false
        default: 'true'
        type: boolean
      skip_virustotal:
        description: 'Skip VirusTotal scan (emergency releases only)'
        required: false
        default: 'false'
        type: boolean
      # Linux ARM64 build permanently disabled per user request 2026-01-01
      # build_linux:
      #   description: 'Build Linux ARM64'
      #   required: false
      #   default: 'true'
      #   type: boolean

env:
  QT_VERSION: '6.10.1'
  HAMLIB_VERSION: '4.6.5'
  # VirusTotal: max malicious detections before blocking release.
  # Unsigned MinGW/NSIS builds typically trigger 1-3 heuristic false positives.
  # Tighten to 1 or 0 after code-signing is implemented.
  VT_MALICIOUS_THRESHOLD: '4'

permissions:
  contents: write

jobs:
  build-windows:
    name: Windows (MinGW)
    runs-on: [self-hosted, windows, X64]
    if: github.event_name != 'workflow_dispatch' || inputs.build_windows == true

    # Self-hosted runner has Qt 6.10.1, MinGW, and Hamlib pre-installed
    env:
      QT_ROOT_DIR: C:/Qt/6.10.1/mingw_64
      HAMLIB_ROOT: C:/hamlib
      MINGW_BIN: C:/Qt/Tools/mingw1310_64/bin

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        clean: false  # Preserve build/ directory for incremental builds
        fetch-depth: 2  # Need HEAD~1 for incremental build detection

    - name: Smart clean (incremental builds)
      shell: bash
      run: |
        # Self-hosted runners keep build dir between runs for fast incremental builds.
        # Force clean rebuild when build system changes or on release tags.
        FORCE_CLEAN=false

        # Always clean for release/tag builds (safety first)
        if [[ "${{ github.ref }}" == refs/tags/* ]]; then
          echo "Tag build - forcing clean rebuild"
          FORCE_CLEAN=true
        # Clean if CMake config changed
        elif git diff HEAD~1 --name-only 2>/dev/null | grep -qE '(CMakeLists\.txt|\.cmake)'; then
          echo "Build system changed - forcing clean rebuild"
          FORCE_CLEAN=true
        # Clean if no previous build exists
        elif [ ! -d build ]; then
          echo "No previous build - clean build"
          FORCE_CLEAN=true
        else
          echo "Incremental build (only recompiling changed files)"
        fi

        if [ "$FORCE_CLEAN" = true ]; then
          rm -rf build || true
        fi

    - name: Validate tr4qt.rc Version Syntax
      shell: bash
      run: |
        echo "=== Validating tr4qt.rc Version Syntax ==="
        echo "This prevents the 'dots instead of commas' error that broke CI builds."
        echo ""
        bash scripts/validate-rc-version.sh

    - name: Validate Qt Module Consistency
      shell: bash
      run: |
        echo "=== Validating Qt Module Consistency ==="
        echo "This checks that all Qt modules in CMakeLists.txt are deployed and verified."
        echo ""
        bash scripts/validate-qt-modules.sh

    - name: Verify Pre-installed Tools
      shell: bash
      run: |
        echo "=== Verifying Pre-installed Build Tools ==="
        echo "Qt: ${{ env.QT_ROOT_DIR }}"
        ls "${{ env.QT_ROOT_DIR }}/bin/Qt6Core.dll" || { echo "ERROR: Qt not found"; exit 1; }
        echo "MinGW: ${{ env.MINGW_BIN }}"
        ls "${{ env.MINGW_BIN }}/g++.exe" || { echo "ERROR: MinGW not found"; exit 1; }
        echo "Hamlib: ${{ env.HAMLIB_ROOT }}"
        ls "${{ env.HAMLIB_ROOT }}/bin/libhamlib-4.dll" || { echo "ERROR: Hamlib not found"; exit 1; }
        echo "✓ All pre-installed tools verified"

    - name: Configure CMake
      shell: bash
      run: |
        export PATH="${{ env.MINGW_BIN }}:$PATH"
        cmake -B build -G "MinGW Makefiles" \
          -DCMAKE_BUILD_TYPE=Release \
          -DCMAKE_PREFIX_PATH="${{ env.QT_ROOT_DIR }}" \
          -DHAMLIB_ROOT="${{ env.HAMLIB_ROOT }}"

    - name: Validate Versions
      shell: bash
      run: |
        echo "=== Version Validation ==="
        echo "Expected Qt: ${{ env.QT_VERSION }}"
        echo "Expected Hamlib: ${{ env.HAMLIB_VERSION }}"

        # Check Qt version from CMake (use -E for portable regex)
        QT_ACTUAL=$(grep -r "Qt6Core" build/CMakeCache.txt | grep -oE '6\.[0-9]+\.[0-9]+' | head -1)
        echo "Detected Qt: $QT_ACTUAL"

        if [ "$QT_ACTUAL" != "${{ env.QT_VERSION }}" ]; then
          echo "ERROR: Qt version mismatch!"
          echo "  Expected: ${{ env.QT_VERSION }}"
          echo "  Detected: $QT_ACTUAL"
          exit 1
        fi

        echo "✓ Qt version validated"

    - name: Build
      shell: bash
      run: |
        export PATH="${{ env.MINGW_BIN }}:$PATH"
        cmake --build build --config Release -j4

    - name: Run Tests
      shell: bash
      timeout-minutes: 5
      run: |
        export PATH="${{ env.MINGW_BIN }}:${{ env.QT_ROOT_DIR }}/bin:${{ env.HAMLIB_ROOT }}/bin:$PATH"
        cd build
        ctest --output-on-failure -C Release --timeout 60
      continue-on-error: true

    - name: Deploy Qt Dependencies
      shell: bash
      run: |
        echo "=== Explicit Qt Deployment (no windeployqt) ==="

        QT_BIN="${{ env.QT_ROOT_DIR }}/bin"
        QT_PLUGINS="${{ env.QT_ROOT_DIR }}/plugins"
        MINGW_BIN="${{ env.MINGW_BIN }}"
        echo "Qt: ${{ env.QT_ROOT_DIR }}"
        echo "MinGW: $MINGW_BIN"
        DEST="build/src"

        # Copy Qt DLLs (explicit list of what we need)
        echo "Copying Qt DLLs..."
        cp "$QT_BIN/Qt6Core.dll" "$DEST/"
        cp "$QT_BIN/Qt6Gui.dll" "$DEST/"
        cp "$QT_BIN/Qt6Widgets.dll" "$DEST/"
        cp "$QT_BIN/Qt6Network.dll" "$DEST/"
        cp "$QT_BIN/Qt6Sql.dll" "$DEST/"
        cp "$QT_BIN/Qt6HttpServer.dll" "$DEST/"
        cp "$QT_BIN/Qt6WebSockets.dll" "$DEST/"
        cp "$QT_BIN/Qt6PrintSupport.dll" "$DEST/"
        cp "$QT_BIN/Qt6Concurrent.dll" "$DEST/"
        cp "$QT_BIN/Qt6SerialPort.dll" "$DEST/"
        cp "$QT_BIN/Qt6Svg.dll" "$DEST/"
        cp "$QT_BIN/Qt6Xml.dll" "$DEST/"
        cp "$QT_BIN/Qt6Qml.dll" "$DEST/"
        cp "$QT_BIN/Qt6Quick.dll" "$DEST/"
        cp "$QT_BIN/Qt6QuickWidgets.dll" "$DEST/"
        cp "$QT_BIN/Qt6ShaderTools.dll" "$DEST/"
        cp "$QT_BIN/Qt6OpenGL.dll" "$DEST/"
        cp "$QT_BIN/Qt6QmlModels.dll" "$DEST/"

        # Copy Qt plugins
        echo "Copying Qt plugins..."
        mkdir -p "$DEST/platforms"
        cp "$QT_PLUGINS/platforms/qwindows.dll" "$DEST/platforms/"

        mkdir -p "$DEST/styles"
        cp "$QT_PLUGINS/styles/qwindowsvistastyle.dll" "$DEST/styles/" || echo "WARNING: qwindowsvistastyle.dll not found (optional)"

        # Copy image format plugins (for PNG, JPG, etc.)
        echo "Copying image format plugins..."
        mkdir -p "$DEST/imageformats"
        if [ -d "$QT_PLUGINS/imageformats" ]; then
          cp "$QT_PLUGINS/imageformats/"*.dll "$DEST/imageformats/" 2>/dev/null || echo "WARNING: No image format plugins found"
          echo "Image formats copied"
        fi

        # Copy SQL drivers (CRITICAL - required for database access)
        echo "Copying SQL drivers..."
        mkdir -p "$DEST/sqldrivers"
        echo "DEBUG: QT_PLUGINS=$QT_PLUGINS"
        echo "DEBUG: Looking for qsqlite.dll in: $QT_PLUGINS/sqldrivers/"
        ls -la "$QT_PLUGINS/sqldrivers/" || echo "ERROR: sqldrivers directory not found!"
        if [ -f "$QT_PLUGINS/sqldrivers/qsqlite.dll" ]; then
          cp "$QT_PLUGINS/sqldrivers/qsqlite.dll" "$DEST/sqldrivers/"
          echo "SUCCESS: qsqlite.dll copied"
        else
          echo "ERROR: qsqlite.dll not found at $QT_PLUGINS/sqldrivers/qsqlite.dll"
          echo "ERROR: This is a FATAL error - application will not work without SQL driver"
          exit 1
        fi

        # Copy TLS plugins (CRITICAL - required for HTTPS connections)
        echo "Copying TLS plugins..."
        mkdir -p "$DEST/tls"
        if [ -d "$QT_PLUGINS/tls" ]; then
          cp "$QT_PLUGINS/tls/"*.dll "$DEST/tls/" 2>/dev/null || echo "WARNING: No TLS plugins found"
          if ls "$DEST/tls/"*.dll >/dev/null 2>&1; then
            echo "SUCCESS: TLS plugins copied"
            ls -lh "$DEST/tls/"*.dll | awk '{print "  " $9, $5}'
          else
            echo "WARNING: No TLS plugins available - HTTPS may not work"
          fi
        else
          echo "WARNING: TLS plugins directory not found at $QT_PLUGINS/tls/"
        fi

        # Copy Hamlib DLLs
        echo "Copying Hamlib DLLs..."
        cp ${{ env.HAMLIB_ROOT }}/bin/*.dll "$DEST/" || true

        # Copy MinGW runtime DLLs (CRITICAL - required for application to run)
        echo "Copying MinGW runtime DLLs from: $MINGW_BIN"

        # Try different libgcc variants (SEH is most common for 64-bit)
        if [ -f "$MINGW_BIN/libgcc_s_seh-1.dll" ]; then
          cp "$MINGW_BIN/libgcc_s_seh-1.dll" "$DEST/"
          echo "SUCCESS: Copied libgcc_s_seh-1.dll"
        elif [ -f "$MINGW_BIN/libgcc_s_dw2-1.dll" ]; then
          cp "$MINGW_BIN/libgcc_s_dw2-1.dll" "$DEST/"
          echo "SUCCESS: Copied libgcc_s_dw2-1.dll"
        elif [ -f "$MINGW_BIN/libgcc_s_sjlj-1.dll" ]; then
          cp "$MINGW_BIN/libgcc_s_sjlj-1.dll" "$DEST/"
          echo "SUCCESS: Copied libgcc_s_sjlj-1.dll"
        else
          echo "ERROR: No libgcc variant found in $MINGW_BIN"
          ls -la "$MINGW_BIN" | grep libgcc || true
          exit 1
        fi

        # Copy other required runtime DLLs
        if [ -f "$MINGW_BIN/libstdc++-6.dll" ]; then
          cp "$MINGW_BIN/libstdc++-6.dll" "$DEST/"
          echo "SUCCESS: Copied libstdc++-6.dll"
        else
          echo "ERROR: libstdc++-6.dll not found in $MINGW_BIN"
          exit 1
        fi

        if [ -f "$MINGW_BIN/libwinpthread-1.dll" ]; then
          cp "$MINGW_BIN/libwinpthread-1.dll" "$DEST/"
          echo "SUCCESS: Copied libwinpthread-1.dll"
        else
          echo "ERROR: libwinpthread-1.dll not found in $MINGW_BIN"
          exit 1
        fi

        # Verify deployment
        echo "=== Deployment Verification ==="
        echo "Qt DLLs:"
        ls -lh "$DEST"/Qt6*.dll | awk '{print "  " $9, $5}'
        echo "SQL Drivers:"
        if [ -d "$DEST/sqldrivers" ] && ls "$DEST/sqldrivers/"*.dll >/dev/null 2>&1; then
          ls -lh "$DEST/sqldrivers/"*.dll | awk '{print "  " $9, $5}'
        else
          echo "  ERROR: No SQL drivers found!"
          exit 1
        fi
        echo "Platforms:"
        ls -lh "$DEST/platforms/"*.dll | awk '{print "  " $9, $5}'
        echo "MinGW Runtime:"
        ls -lh "$DEST"/lib*.dll | awk '{print "  " $9, $5}'

        # Run comprehensive deployment verification
        echo ""
        echo "=== Running Comprehensive Deployment Verification ==="
        bash scripts/verify-deployment.sh build/src

    - name: Create Installer
      shell: bash
      run: |
        export PATH="/c/Program Files (x86)/NSIS:$PATH"

        # Build installer
        cd installer
        makensis tr4qt.nsi

    - name: Verify Installer Contents
      shell: bash
      run: |
        echo "=== Verifying Installer Contents ==="

        # Find the installer file
        INSTALLER=$(ls build/src/TR4QT-*-Setup.exe | head -1)
        echo "Checking installer: $INSTALLER"

        # List installer contents
        echo "Full installer contents:"
        "/c/Program Files/7-Zip/7z.exe" l "$INSTALLER"

        # Critical verification: Check for QSQLITE driver
        echo ""
        echo "=== CRITICAL: Verifying QSQLITE driver ==="
        if "/c/Program Files/7-Zip/7z.exe" l "$INSTALLER" | grep -q "sqldrivers.*qsqlite.dll"; then
          echo "✓ SUCCESS: qsqlite.dll found in installer"
        else
          echo "✗ ERROR: qsqlite.dll NOT found in installer!"
          echo "This is a FATAL error - installer will not work without SQL driver"
          exit 1
        fi

        # Verify other critical components
        echo ""
        echo "=== Verifying other critical components ==="
        "/c/Program Files/7-Zip/7z.exe" l "$INSTALLER" | grep -E "(tr4qt.exe|Qt6Core.dll|platforms.*qwindows.dll|sqldrivers.*qsqlite.dll)" || true

    - name: Smoke Test Installer
      shell: bash
      run: |
        echo "=== Smoke Testing Windows Installer ==="

        # Find the installer
        INSTALLER=$(ls build/src/TR4QT-*-Setup.exe | head -1)
        echo "Testing installer: $INSTALLER"

        # Verify installer file size (should be >15MB for Qt app with all dependencies)
        # NSIS compresses well, so compressed size is much smaller than uncompressed
        SIZE=$(stat -c%s "$INSTALLER" 2>/dev/null || stat -f%z "$INSTALLER")
        SIZE_MB=$((SIZE / 1024 / 1024))
        echo "Installer size: ${SIZE_MB}MB"

        if [ $SIZE_MB -lt 15 ]; then
          echo "✗ ERROR: Installer suspiciously small (< 15MB)"
          echo "This suggests missing dependencies or build failure"
          exit 1
        fi

        if [ $SIZE_MB -gt 200 ]; then
          echo "⚠ WARNING: Installer unusually large (> 200MB)"
          echo "This might indicate unnecessary files were included"
        fi

        echo "✓ Installer size verified: ${SIZE_MB}MB"
        echo "Note: Installer contents already verified by 7-Zip in previous step"
        echo "Note: Skipping actual installation (unreliable in CI, takes 10+ minutes)"
        echo "✓ Smoke test completed successfully"

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: TR4QT-Windows
        path: |
          build/src/tr4qt.exe
          build/src/*.dll
          build/src/platforms/
          build/src/sqldrivers/
          build/src/imageformats/
          build/src/styles/
          build/src/tls/
          build/src/TR4QT-*-Setup.exe

    - name: Notify Slack - Windows Complete
      if: always()
      shell: bash
      run: |
        if [ "${{ job.status }}" == "success" ]; then
          STATUS="✅ SUCCESS"
          COLOR="good"
        else
          STATUS="❌ FAILED"
          COLOR="danger"
        fi
        curl -X POST ${{ secrets.SLACK_WEBHOOK_URL }} \
          -H 'Content-Type: application/json' \
          -d "{
            \"attachments\": [{
              \"color\": \"$COLOR\",
              \"title\": \"Windows Build $STATUS\",
              \"fields\": [
                {\"title\": \"Status\", \"value\": \"${{ job.status }}\", \"short\": true},
                {\"title\": \"Duration\", \"value\": \"${{ job.duration }}\", \"short\": true},
                {\"title\": \"Branch\", \"value\": \"${{ github.ref_name }}\", \"short\": true},
                {\"title\": \"Build URL\", \"value\": \"<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View Build>\", \"short\": false}
              ]
            }]
          }"

  build-macos:
    name: macOS
    runs-on: macos-latest
    if: github.event_name != 'workflow_dispatch' || inputs.build_macos == true

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Validate Qt Module Consistency
      run: |
        echo "=== Validating Qt Module Consistency ==="
        echo "This checks that all Qt modules in CMakeLists.txt are deployed and verified."
        echo ""
        bash scripts/validate-qt-modules.sh

    - name: Install Qt
      uses: jurplel/install-qt-action@v4
      with:
        version: ${{ env.QT_VERSION }}
        host: mac
        target: desktop
        modules: 'qtwebsockets qthttpserver qtserialport qtshadertools'  # shadertools for QRhi waterfall (Qt Quick/QML is in base)
        cache: true

    - name: Install Other Dependencies
      run: |
        brew install libusb

    - name: Build Hamlib from source (unsigned)
      run: |
        curl -L -o hamlib.tar.gz "https://github.com/Hamlib/Hamlib/releases/download/${{ env.HAMLIB_VERSION }}/hamlib-${{ env.HAMLIB_VERSION }}.tar.gz"
        tar -xzf hamlib.tar.gz
        cd hamlib-${{ env.HAMLIB_VERSION }}
        ./configure --prefix=$HOME/hamlib-unsigned --disable-static
        make -j$(sysctl -n hw.ncpu)
        make install
        echo "HAMLIB_ROOT=$HOME/hamlib-unsigned" >> $GITHUB_ENV

    - name: Configure CMake
      run: |
        cmake -B build \
          -DCMAKE_BUILD_TYPE=Release \
          -DCMAKE_PREFIX_PATH="${{ env.QT_ROOT_DIR }}" \
          -DHAMLIB_ROOT="$HOME/hamlib-unsigned"

    - name: Validate Versions
      run: |
        echo "=== Version Validation ==="
        echo "Expected Qt: ${{ env.QT_VERSION }}"
        echo "Expected Hamlib: ${{ env.HAMLIB_VERSION }}"

        # Check Qt version from CMake
        QT_ACTUAL=$(grep -r "Qt6Core" build/CMakeCache.txt | grep -oE '6\.[0-9]+\.[0-9]+' | head -1)
        echo "Detected Qt: $QT_ACTUAL"

        if [ "$QT_ACTUAL" != "${{ env.QT_VERSION }}" ]; then
          echo "ERROR: Qt version mismatch!"
          echo "  Expected: ${{ env.QT_VERSION }}"
          echo "  Detected: $QT_ACTUAL"
          exit 1
        fi

        echo "✓ Qt version validated"

    - name: Build
      run: cmake --build build --config Release -j$(sysctl -n hw.ncpu)

    - name: Run Tests
      run: |
        cd build
        ctest --output-on-failure -C Release
      continue-on-error: true

    - name: Create App Bundle
      run: |
        cd build/src

        # Copy unsigned Hamlib dylib into the app bundle
        mkdir -p tr4qt.app/Contents/Frameworks
        cp $HOME/hamlib-unsigned/lib/libhamlib.*.dylib tr4qt.app/Contents/Frameworks/ || true

        # Bundle Qt frameworks and plugins with macdeployqt
        ${{ env.QT_ROOT_DIR }}/bin/macdeployqt tr4qt.app -verbose=2

        # CRITICAL: Copy TLS plugins (macdeployqt doesn't bundle these reliably)
        echo "Copying TLS plugins..."
        mkdir -p tr4qt.app/Contents/PlugIns/tls
        if [ -d "${{ env.QT_ROOT_DIR }}/plugins/tls" ]; then
          cp ${{ env.QT_ROOT_DIR }}/plugins/tls/*.dylib tr4qt.app/Contents/PlugIns/tls/ || true
        fi
        echo "TLS plugins copied:"
        ls -lh tr4qt.app/Contents/PlugIns/tls/ || echo "No TLS plugins found"

        # Copy any missing Homebrew dependencies (if needed)
        # These may not be needed with install-qt-action, but keep as fallback
        if [ -f "/opt/homebrew/opt/brotli/lib/libbrotlicommon.1.dylib" ]; then
          cp /opt/homebrew/opt/brotli/lib/libbrotlicommon.1.dylib tr4qt.app/Contents/Frameworks/ || true
        fi
        if [ -d "/opt/homebrew/opt/qtbase/lib/QtDBus.framework" ]; then
          cp -R /opt/homebrew/opt/qtbase/lib/QtDBus.framework tr4qt.app/Contents/Frameworks/ || true
        fi
        if [ -f "/opt/homebrew/opt/dbus/lib/libdbus-1.3.dylib" ]; then
          cp /opt/homebrew/opt/dbus/lib/libdbus-1.3.dylib tr4qt.app/Contents/Frameworks/ || true
        fi

        # Fix library paths to use @rpath
        for lib in tr4qt.app/Contents/Frameworks/libhamlib.*.dylib; do
          if [ -f "$lib" ]; then
            install_name_tool -id "@rpath/$(basename $lib)" "$lib"
          fi
        done

        # Fix manually copied libraries to use @rpath
        if [ -f "tr4qt.app/Contents/Frameworks/libbrotlicommon.1.dylib" ]; then
          install_name_tool -id "@rpath/libbrotlicommon.1.dylib" tr4qt.app/Contents/Frameworks/libbrotlicommon.1.dylib
        fi

        if [ -f "tr4qt.app/Contents/Frameworks/libdbus-1.3.dylib" ]; then
          install_name_tool -id "@rpath/libdbus-1.3.dylib" tr4qt.app/Contents/Frameworks/libdbus-1.3.dylib
        fi

        if [ -f "tr4qt.app/Contents/Frameworks/QtDBus.framework/Versions/A/QtDBus" ]; then
          install_name_tool -id "@rpath/QtDBus.framework/Versions/A/QtDBus" tr4qt.app/Contents/Frameworks/QtDBus.framework/Versions/A/QtDBus
          # Fix QtDBus dependency on libdbus to use @rpath instead of absolute path
          install_name_tool -change "/opt/homebrew/opt/dbus/lib/libdbus-1.3.dylib" "@rpath/libdbus-1.3.dylib" tr4qt.app/Contents/Frameworks/QtDBus.framework/Versions/A/QtDBus
        fi

        # Update executable to look for libraries in @rpath
        install_name_tool -add_rpath "@executable_path/../Frameworks" tr4qt.app/Contents/MacOS/tr4qt || true

        # Sign everything with ad-hoc signatures
        # Sign all dylibs in Frameworks
        for lib in tr4qt.app/Contents/Frameworks/*.dylib; do
          if [ -f "$lib" ]; then
            codesign -s - -f "$lib"
          fi
        done

        # Sign all Qt frameworks
        for framework in tr4qt.app/Contents/Frameworks/*.framework; do
          if [ -d "$framework" ]; then
            codesign -s - -f "$framework"
          fi
        done

        # Sign all plugins
        find tr4qt.app/Contents/PlugIns -name "*.dylib" -exec codesign -s - -f {} \;

        # Sign the executable
        codesign -s - -f tr4qt.app/Contents/MacOS/tr4qt

        # Sign the entire app bundle
        codesign -s - -f tr4qt.app

        # Create DMG manually with hdiutil (macdeployqt -dmg breaks signatures)
        # Extract version from Constants.h for filename
        VERSION=$(grep 'APP_VERSION' ../../src/core/Constants.h | cut -d'"' -f2)
        mkdir -p dmg-contents
        cp -R tr4qt.app dmg-contents/
        hdiutil create -volname "TR4QT" -srcfolder dmg-contents -ov -format UDZO "TR4QT-${VERSION}-macOS.dmg"
        rm -rf dmg-contents

    - name: Verify App Bundle Contents
      working-directory: build/src
      run: |
        echo "=== Verifying macOS App Bundle Contents ==="

        # Critical verification: Check for QSQLITE driver
        echo ""
        echo "=== CRITICAL: Verifying QSQLITE driver ==="
        if [ -f "tr4qt.app/Contents/PlugIns/sqldrivers/libqsqlite.dylib" ]; then
          echo "✓ SUCCESS: libqsqlite.dylib found in app bundle"
          ls -lh tr4qt.app/Contents/PlugIns/sqldrivers/
        else
          echo "✗ ERROR: libqsqlite.dylib NOT found in app bundle!"
          echo "Expected location: tr4qt.app/Contents/PlugIns/sqldrivers/libqsqlite.dylib"
          echo "This is a FATAL error - app will not work without SQL driver"
          exit 1
        fi

        # Critical verification: Check for TLS plugins
        echo ""
        echo "=== CRITICAL: Verifying TLS plugins ==="
        if [ -d "tr4qt.app/Contents/PlugIns/tls" ] && ls tr4qt.app/Contents/PlugIns/tls/*.dylib >/dev/null 2>&1; then
          echo "✓ SUCCESS: TLS plugins found in app bundle"
          ls -lh tr4qt.app/Contents/PlugIns/tls/
        else
          echo "✗ ERROR: TLS plugins NOT found in app bundle!"
          echo "Expected location: tr4qt.app/Contents/PlugIns/tls/"
          echo "This is a FATAL error - HTTPS downloads will not work without TLS plugins"
          exit 1
        fi

        # Verify other critical components
        echo ""
        echo "=== Verifying other critical components ==="
        echo "Executable:"
        ls -lh tr4qt.app/Contents/MacOS/tr4qt
        echo ""
        echo "Qt Frameworks:"
        ls -d tr4qt.app/Contents/Frameworks/Qt*.framework 2>/dev/null | head -5
        echo ""
        echo "Platform plugins:"
        ls -lh tr4qt.app/Contents/PlugIns/platforms/ 2>/dev/null || echo "No platform plugins found"

        # Verify no absolute Homebrew paths in libraries
        echo ""
        echo "=== Checking for absolute Homebrew paths (should be none) ==="
        HOMEBREW_PATHS=$(find tr4qt.app/Contents/Frameworks -type f -exec otool -L {} \; 2>/dev/null | grep "/opt/homebrew" | grep -v "@rpath" | wc -l)
        if [ "$HOMEBREW_PATHS" -eq 0 ]; then
          echo "✓ SUCCESS: No absolute Homebrew paths found"
        else
          echo "⚠ WARNING: Found $HOMEBREW_PATHS absolute Homebrew path references"
          find tr4qt.app/Contents/Frameworks -type f -exec otool -L {} \; 2>/dev/null | grep "/opt/homebrew" | grep -v "@rpath" | sort -u
        fi

    - name: Smoke Test App Bundle
      working-directory: build/src
      run: |
        echo "=== Smoke Testing macOS App Bundle ==="

        # Verify critical frameworks and libraries are present
        echo ""
        echo "=== Verifying bundled frameworks ==="
        MISSING_FILES=0
        for framework in QtCore QtGui QtWidgets QtSql; do
          if [ ! -d "tr4qt.app/Contents/Frameworks/${framework}.framework" ]; then
            echo "✗ ERROR: Missing ${framework}.framework"
            MISSING_FILES=$((MISSING_FILES + 1))
          else
            echo "✓ Found ${framework}.framework"
          fi
        done

        if [ $MISSING_FILES -gt 0 ]; then
          echo "✗ FATAL: $MISSING_FILES required frameworks missing!"
          exit 1
        fi

        echo ""
        echo "✓ All critical frameworks verified in app bundle"
        echo "Note: Skipping executable test (Qt GUI apps require display, unavailable in CI)"
        echo "✓ Smoke test completed successfully"

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: TR4QT-macOS
        path: build/src/TR4QT-*-macOS.dmg

    - name: Notify Slack - macOS Complete
      if: always()
      run: |
        if [ "${{ job.status }}" == "success" ]; then
          STATUS="✅ SUCCESS"
          COLOR="good"
        else
          STATUS="❌ FAILED"
          COLOR="danger"
        fi
        curl -X POST ${{ secrets.SLACK_WEBHOOK_URL }} \
          -H 'Content-Type: application/json' \
          -d "{
            \"attachments\": [{
              \"color\": \"$COLOR\",
              \"title\": \"macOS Build $STATUS\",
              \"fields\": [
                {\"title\": \"Status\", \"value\": \"${{ job.status }}\", \"short\": true},
                {\"title\": \"Branch\", \"value\": \"${{ github.ref_name }}\", \"short\": true},
                {\"title\": \"Build URL\", \"value\": \"<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View Build>\", \"short\": false}
              ]
            }]
          }"

  # Linux x86_64 build - uses self-hosted runner on Proxmox
  # Runs after Windows to avoid CPU thrashing (both runners share same Proxmox host)
  build-linux-x86_64:
    name: Linux (x86_64)
    needs: [build-windows]
    runs-on: [self-hosted, linux, X64]
    if: always()  # Run even if Windows build fails
    continue-on-error: true  # Don't fail the workflow if Linux build fails

    # Self-hosted runner has Qt 6.10.1 at /opt/Qt and Hamlib at /opt/hamlib pre-installed
    env:
      QT_ROOT_DIR: /opt/Qt/6.10.1/gcc_64
      HAMLIB_ROOT: /opt/hamlib

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        clean: false  # Preserve build/ directory for incremental builds
        fetch-depth: 2  # Need HEAD~1 for incremental build detection

    - name: Smart clean (incremental builds)
      run: |
        # Self-hosted runners keep build dir between runs for fast incremental builds.
        # Force clean rebuild when build system changes or on release tags.
        FORCE_CLEAN=false

        if [[ "${{ github.ref }}" == refs/tags/* ]]; then
          echo "Tag build - forcing clean rebuild"
          FORCE_CLEAN=true
        elif git diff HEAD~1 --name-only 2>/dev/null | grep -qE '(CMakeLists\.txt|\.cmake)'; then
          echo "Build system changed - forcing clean rebuild"
          FORCE_CLEAN=true
        elif [ ! -d build ]; then
          echo "No previous build - clean build"
          FORCE_CLEAN=true
        else
          echo "Incremental build (only recompiling changed files)"
        fi

        if [ "$FORCE_CLEAN" = true ]; then
          rm -rf build || true
        fi

    - name: Configure CMake
      run: |
        cmake -B build \
          -DCMAKE_BUILD_TYPE=Release \
          -DCMAKE_PREFIX_PATH="${{ env.QT_ROOT_DIR }}" \
          -DHAMLIB_ROOT="${{ env.HAMLIB_ROOT }}" \
          -DCMAKE_INSTALL_PREFIX=/usr

    - name: Validate Versions
      run: |
        echo "=== Version Validation ==="
        echo "Expected Qt: ${{ env.QT_VERSION }}"
        echo "Expected Hamlib: ${{ env.HAMLIB_VERSION }}"

        QT_ACTUAL=$(grep -r "Qt6Core" build/CMakeCache.txt | grep -oE '6\.[0-9]+\.[0-9]+' | head -1)
        echo "Detected Qt: $QT_ACTUAL"

        if [ "$QT_ACTUAL" != "${{ env.QT_VERSION }}" ]; then
          echo "ERROR: Qt version mismatch!"
          exit 1
        fi
        echo "✓ Qt version validated"

    - name: Build
      run: cmake --build build --config Release -j$(nproc)

    - name: Run Tests
      run: |
        cd build
        ctest --output-on-failure -C Release
      continue-on-error: true

    - name: Create AppImage
      run: |
        # === Explicit Linux x86_64 Deployment (no linuxdeploy-plugin-qt) ===
        # linuxdeploy-plugin-qt fails because:
        # 1. TR4QT.Panadapter QML module is registered at runtime via qmlRegisterType
        #    (not a file-based module), causing "Missing qml module" error
        # 2. It tries to deploy Oracle SQL driver (qsqloci) which needs libclntsh.so
        # Solution: Manual Qt deployment like Windows/macOS builds

        # Install to AppDir
        DESTDIR=$PWD/appdir cmake --install build
        mkdir -p appdir/usr/share/applications
        mkdir -p appdir/usr/share/icons/hicolor/256x256/apps

        # Copy icon (use a placeholder if not exists)
        if [ -f "resources/icons/tr4qt.png" ]; then
          cp resources/icons/tr4qt.png appdir/usr/share/icons/hicolor/256x256/apps/
        else
          # Create a simple placeholder icon
          convert -size 256x256 xc:navy -fill white -gravity center -pointsize 48 -annotate 0 "TR4QT" appdir/usr/share/icons/hicolor/256x256/apps/tr4qt.png 2>/dev/null || true
        fi

        # Create desktop entry
        cat > appdir/usr/share/applications/tr4qt.desktop << 'EOF'
        [Desktop Entry]
        Type=Application
        Name=TR4QT
        Comment=Amateur Radio Contest Logger
        Exec=tr4qt
        Icon=tr4qt
        Categories=HamRadio;Network;
        EOF

        # === Manual Qt Library Deployment ===
        QT_LIB="${{ env.QT_ROOT_DIR }}/lib"
        QT_PLUGINS="${{ env.QT_ROOT_DIR }}/plugins"
        DEST_LIB="appdir/usr/lib"
        DEST_PLUGINS="appdir/usr/plugins"

        mkdir -p "$DEST_LIB" "$DEST_PLUGINS"

        echo "=== Copying Qt libraries ==="
        # Core Qt libraries
        for lib in Core Gui Widgets Network Sql HttpServer WebSockets PrintSupport \
                   Concurrent SerialPort Svg Xml Qml Quick QuickWidgets \
                   ShaderTools OpenGL QmlModels DBus XcbQpa; do
          if [ -f "$QT_LIB/libQt6${lib}.so.6" ]; then
            cp -L "$QT_LIB/libQt6${lib}.so.6" "$DEST_LIB/"
            echo "  Copied libQt6${lib}.so.6"
          fi
        done

        echo "=== Copying Qt plugins ==="
        # Platform plugin (CRITICAL)
        mkdir -p "$DEST_PLUGINS/platforms"
        cp "$QT_PLUGINS/platforms/libqxcb.so" "$DEST_PLUGINS/platforms/"
        echo "  Copied platforms/libqxcb.so"

        # SQL drivers - ONLY SQLite (skip Oracle qsqloci which needs libclntsh.so)
        mkdir -p "$DEST_PLUGINS/sqldrivers"
        cp "$QT_PLUGINS/sqldrivers/libqsqlite.so" "$DEST_PLUGINS/sqldrivers/"
        echo "  Copied sqldrivers/libqsqlite.so"

        # Image formats
        mkdir -p "$DEST_PLUGINS/imageformats"
        cp "$QT_PLUGINS/imageformats/"*.so "$DEST_PLUGINS/imageformats/" 2>/dev/null || true
        echo "  Copied imageformats/"

        # TLS plugins (CRITICAL for HTTPS)
        mkdir -p "$DEST_PLUGINS/tls"
        if [ -d "$QT_PLUGINS/tls" ]; then
          cp "$QT_PLUGINS/tls/"*.so "$DEST_PLUGINS/tls/" 2>/dev/null || true
          echo "  Copied tls/"
        fi

        # Icon engines
        mkdir -p "$DEST_PLUGINS/iconengines"
        cp "$QT_PLUGINS/iconengines/"*.so "$DEST_PLUGINS/iconengines/" 2>/dev/null || true

        # XCB GL integration
        mkdir -p "$DEST_PLUGINS/xcbglintegrations"
        cp "$QT_PLUGINS/xcbglintegrations/"*.so "$DEST_PLUGINS/xcbglintegrations/" 2>/dev/null || true

        # Platform themes
        mkdir -p "$DEST_PLUGINS/platformthemes"
        cp "$QT_PLUGINS/platformthemes/"*.so "$DEST_PLUGINS/platformthemes/" 2>/dev/null || true

        echo "=== Copying Hamlib ==="
        cp ${{ env.HAMLIB_ROOT }}/lib/libhamlib.so* "$DEST_LIB/"

        echo "=== Copying ICU libraries (if needed) ==="
        for lib in "$QT_LIB"/libicu*.so.*; do
          if [ -f "$lib" ]; then
            cp -L "$lib" "$DEST_LIB/"
          fi
        done

        # Create AppRun script
        cat > appdir/AppRun << 'APPRUN'
        #!/bin/bash
        SELF=$(readlink -f "$0")
        HERE=${SELF%/*}
        export LD_LIBRARY_PATH="${HERE}/usr/lib:$LD_LIBRARY_PATH"
        export QT_PLUGIN_PATH="${HERE}/usr/plugins"
        export QT_QPA_PLATFORM_PLUGIN_PATH="${HERE}/usr/plugins/platforms"
        exec "${HERE}/usr/bin/tr4qt" "$@"
        APPRUN
        chmod +x appdir/AppRun

        # Symlink for .desktop
        ln -sf usr/share/applications/tr4qt.desktop appdir/tr4qt.desktop
        ln -sf usr/share/icons/hicolor/256x256/apps/tr4qt.png appdir/tr4qt.png 2>/dev/null || \
          ln -sf usr/share/icons/hicolor/256x256/apps/tr4qt.png appdir/.DirIcon 2>/dev/null || true

        echo "=== Creating AppImage with linuxdeploy (no Qt plugin) ==="
        # Download linuxdeploy (NOT the Qt plugin)
        wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
        chmod +x linuxdeploy-x86_64.AppImage

        export LD_LIBRARY_PATH="${{ env.QT_ROOT_DIR }}/lib:${{ env.HAMLIB_ROOT }}/lib:$LD_LIBRARY_PATH"

        # Use linuxdeploy to bundle system library dependencies and create AppImage
        # NOT using --plugin qt (we did manual Qt deployment above)
        ./linuxdeploy-x86_64.AppImage \
          --appdir appdir \
          --output appimage \
          --desktop-file appdir/usr/share/applications/tr4qt.desktop

        # Rename to include version
        VERSION=$(grep 'APP_VERSION' src/core/Constants.h | cut -d'"' -f2)
        mv TR4QT*.AppImage TR4QT-${VERSION}-x86_64.AppImage

        echo "=== AppImage created ==="
        ls -lh TR4QT-*.AppImage

    - name: Verify AppImage
      run: |
        APPIMAGE=$(ls TR4QT-*-x86_64.AppImage | head -1)
        echo "Created: $APPIMAGE"
        ls -lh "$APPIMAGE"

        SIZE=$(stat -c%s "$APPIMAGE")
        SIZE_MB=$((SIZE / 1024 / 1024))
        echo "Size: ${SIZE_MB}MB"

        if [ $SIZE_MB -lt 20 ]; then
          echo "WARNING: AppImage seems small (< 20MB)"
        fi

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: TR4QT-Linux-x86_64
        path: TR4QT-*-x86_64.AppImage

