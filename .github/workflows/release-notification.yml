name: Release Notification

on:
  release:
    types: [published]  # Only trigger when release is made public (not draft)

jobs:
  notify-slack:
    name: Notify Slack of Public Release
    runs-on: ubuntu-latest

    steps:
    - name: Send notification to Slack
      uses: slackapi/slack-github-action@v1.27.0
      with:
        payload: |
          {
            "text": "🎉 TR4QT ${{ github.event.release.tag_name }} Released! Download: ${{ github.event.release.html_url }}",
            "blocks": [
              {
                "type": "header",
                "text": {
                  "type": "plain_text",
                  "text": "🎉 TR4QT ${{ github.event.release.tag_name }} Released!"
                }
              },
              {
                "type": "section",
                "fields": [
                  {
                    "type": "mrkdwn",
                    "text": "*Release:*\n${{ github.event.release.name }}"
                  },
                  {
                    "type": "mrkdwn",
                    "text": "*Tag:*\n${{ github.event.release.tag_name }}"
                  }
                ]
              },
              {
                "type": "section",
                "text": {
                  "type": "mrkdwn",
                  "text": "<${{ github.event.release.html_url }}|📥 Download Release>\n\n${{ github.event.release.body }}"
                }
              }
            ]
          }
      env:
        SLACK_WEBHOOK_URL: ${{ secrets.SLACK_RELEASE_WEBHOOK_URL }}
